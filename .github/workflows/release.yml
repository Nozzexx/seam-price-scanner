# Builds the scanner on GitHub's own Windows machine from the tagged commit, then
# publishes the installer and the portable zip, each with its SHA-256 and a signed
# build-provenance attestation, so anyone can check a download was made from
# this repository's code:
#   gh attestation verify SEAM-Price-Scanner-Setup.exe --repo Nozzexx/seam-price-scanner
#
# Release: bump VERSION in seam_scanner.py and packaging/version-info.txt, add a
# '## <version> (<date>)' section to CHANGELOG.md, commit, then:
#   git tag v1.4.1; git push origin v1.4.1

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # create the release
  id-token: write       # sign the attestation
  attestations: write   # store the attestation

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $v = (Select-String -Path seam_scanner.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match VERSION $v" }
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV

      - name: Take this version's notes from CHANGELOG.md
        shell: pwsh
        run: |
          # The section from '## <version>' up to the next '## ' heading. The site's download
          # page reads the same file, so the notes are written once.
          $m = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^## $([regex]::Escape($env:VERSION))\b[^\n]*\n(.*?)(?=^## |\z)")
          if (-not $m.Success -or -not $m.Groups[1].Value.Trim()) { throw "CHANGELOG.md has no '## $env:VERSION' section" }
          $m.Groups[1].Value.Trim() | Out-File -Encoding utf8 changes.md

      - name: Install exact dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.txt

      - name: Install Inno Setup (makes the installer)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          "ISCC_PATH=${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" | Out-File -Append $env:GITHUB_ENV

      - name: Build
        shell: cmd
        run: build-exe.bat

      - name: Check both downloads were built
        shell: pwsh
        run: |
          foreach ($f in "dist/SEAM-Price-Scanner-Setup.exe", "dist/SEAM-Price-Scanner-$env:VERSION.zip") { if (-not (Test-Path $f)) { throw "missing $f" } }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/SEAM-Price-Scanner-Setup.exe
            dist/SEAM-Price-Scanner-${{ env.VERSION }}.zip

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "dist/SEAM-Price-Scanner-Setup.exe"
          $zip = "dist/SEAM-Price-Scanner-$env:VERSION.zip"
          $hs = (Get-FileHash $setup -Algorithm SHA256).Hash
          $hz = (Get-FileHash $zip -Algorithm SHA256).Hash
          $changes = Get-Content changes.md -Raw
          $notes = @"
          $changes

          ---

          Built by GitHub Actions from commit ${{ github.sha }} ([build log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

          | Download | SHA-256 |
          | --- | --- |
          | **SEAM-Price-Scanner-Setup.exe** (installer, recommended) | ``$hs`` |
          | SEAM-Price-Scanner-$env:VERSION.zip (portable, no install) | ``$hz`` |

          Check a download: ``Get-FileHash .\SEAM-Price-Scanner-Setup.exe -Algorithm SHA256``
          Prove where it was built: ``gh attestation verify .\SEAM-Price-Scanner-Setup.exe --repo ${{ github.repository }}``
          "@
          gh release create "${{ github.ref_name }}" $setup "$setup.sha256" $zip "$zip.sha256" --title "S.E.A.M. Price Scanner $env:VERSION" --notes $notes
